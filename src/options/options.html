<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HistGuard - 历史记录管理与控制台</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="app-layout">
    <!-- 顶部导航与全局状态 -->
    <header class="app-header">
      <div class="header-content">
        <div class="brand-area">
          <span class="brand-logo">🛡️</span>
          <div>
            <h1 class="brand-title">HistGuard 控制台</h1>
            <p class="brand-subtitle">轻量级跨浏览器历史记录智能管理与自动隐私拦截</p>
          </div>
        </div>

        <div class="stats-bar">
          <div class="stat-item">
            <span class="stat-label">启用规则</span>
            <span id="stat-active-rules" class="stat-value">0</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-label">累计拦截</span>
            <span id="stat-total-hits" class="stat-value highlight-hits">0</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat-item">
            <span class="stat-label">静默模式</span>
            <span id="stat-silent-status" class="stat-value silent-off">未开启</span>
          </div>
        </div>
      </div>
    </header>

    <!-- 主控台双卡片对齐栅格 -->
    <main class="main-grid">
      <!-- 模块 A：历史批量大扫除 -->
      <section class="card module-card">
        <div class="card-header">
          <div class="card-title-group">
            <span class="module-tag tag-a">模块 A</span>
            <h2 class="card-title">历史批量大扫除</h2>
          </div>
          <div class="time-filters">
            <button class="filter-capsule active" data-time="all">全部</button>
            <button class="filter-capsule" data-time="1h">1小时</button>
            <button class="filter-capsule" data-time="today">今天</button>
            <button class="filter-capsule" data-time="7d">7天</button>
          </div>
        </div>

        <!-- 搜索栏 -->
        <div class="action-row search-box-wrapper">
          <span class="search-icon">🔍</span>
          <input 
            type="text" 
            id="search-input" 
            class="search-input" 
            placeholder="搜索域名、URL 路径或标题 (支持防抖检索)..." 
            autocomplete="off"
            spellcheck="false"
          >
          <button id="btn-clear-search" class="clear-search-btn hidden" title="清空搜索">✕</button>
        </div>

        <!-- 列表控制工具栏 -->
        <div class="list-toolbar">
          <div class="toolbar-left">
            <span id="search-results-summary" class="results-summary">共检索到 0 条</span>
            <span class="summary-separator">·</span>
            <span id="selected-summary" class="selected-summary">已勾选 0 条</span>
          </div>
          <div class="toolbar-right">
            <button id="btn-select-all" class="text-btn">全选</button>
            <button id="btn-invert-select" class="text-btn">反选</button>
          </div>
        </div>

        <!-- 防误删预览列表容器 -->
        <div class="list-wrapper preview-list-wrapper">
          <div id="history-preview-list" class="preview-list">
            <div class="empty-state">
              <span class="empty-icon">🔎</span>
              <p>输入搜索词开始检索，或选择时间范围查看历史</p>
            </div>
          </div>
        </div>

        <!-- 模块 A 底部操作栏 -->
        <div class="card-footer">
          <button id="btn-delete-selected" class="btn btn-danger" disabled>
            <span class="btn-icon">🗑️</span>
            <span id="btn-delete-text">删除选中的 0 条记录</span>
          </button>
          <button id="btn-delete-and-add-rule" class="btn btn-primary" disabled>
            <span class="btn-icon">🛡️</span>
            <span>删除并加入永久隐藏</span>
          </button>
        </div>
      </section>

      <!-- 模块 B：自动防护规则管理 -->
      <section class="card module-card">
        <div class="card-header">
          <div class="card-title-group">
            <span class="module-tag tag-b">模块 B</span>
            <h2 class="card-title">防护规则管理</h2>
          </div>
          <div class="header-tools">
            <button id="btn-import-json" class="tool-btn" title="从 JSON 文件导入规则备份">
              <span>📥 导入</span>
            </button>
            <button id="btn-export-json" class="tool-btn" title="导出当前所有规则为 JSON 备份">
              <span>📤 导出</span>
            </button>
            <input type="file" id="file-import-input" accept=".json,application/json" class="hidden">
          </div>
        </div>

        <!-- 手动新增规则栏 -->
        <div class="action-row add-rule-form">
          <div class="input-with-select">
            <input 
              type="text" 
              id="new-rule-input" 
              class="text-input" 
              placeholder="输入如 *.example.com 或 domain.com/path/*"
              spellcheck="false"
            >
            <select id="new-rule-type" class="type-select">
              <option value="auto">自动类型</option>
              <option value="domain">域名匹配</option>
              <option value="path">路径匹配</option>
            </select>
          </div>
          <button id="btn-add-rule" class="btn btn-primary-add">
            <span>+ 添加</span>
          </button>
        </div>

        <!-- 规则列表工具栏 -->
        <div class="list-toolbar">
          <div class="toolbar-left">
            <span id="rules-count-summary" class="results-summary">当前共有 0 条防护规则</span>
          </div>
          <div class="toolbar-right">
            <button id="btn-toggle-all" class="text-btn" title="一键反转所有规则启用状态">反转状态</button>
          </div>
        </div>

        <!-- 规则管理列表容器 -->
        <div class="list-wrapper rules-list-wrapper">
          <div id="rules-container" class="rules-container">
            <div class="empty-state">
              <span class="empty-icon">📋</span>
              <p>暂无配置规则，您可在左侧搜索加入，或在上方手动添加</p>
            </div>
          </div>
        </div>

        <!-- 模块 B 底部操作栏 -->
        <div class="card-footer">
          <button id="btn-enable-all" class="btn btn-secondary">
            <span class="btn-icon">⚡</span>
            <span>全部启用</span>
          </button>
          <button id="btn-clear-disabled" class="btn btn-secondary-danger">
            <span class="btn-icon">🧹</span>
            <span>清理已停用规则</span>
          </button>
        </div>
      </section>
    </main>

    <!-- 操作提示 Toast 浮层 -->
    <div id="toast" class="toast hidden">操作成功</div>
  </div>

  <script type="module" src="options.js"></script>
</body>
</html>
