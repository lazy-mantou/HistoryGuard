<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 浅色背景高雅渐变 -->
    <linearGradient id="hg-light-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- 翡翠青绿防护渐变 (Emerald Cyan) -->
    <linearGradient id="hg-shield-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- 柔和轻投影 -->
    <filter id="hg-soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- 浅色圆角矩阵底座 (Light Squircle) -->
  <rect x="18" y="18" width="476" height="476" rx="105" fill="url(#hg-light-bg)" stroke="#cbd5e1" stroke-width="7" filter="url(#hg-soft-shadow)" />

  <!-- 简约盾牌主体 (Simple Shield) -->
  <path d="M 256 98 
           C 328 98, 392 112, 400 134 
           C 406 272, 340 382, 256 428 
           C 172 382, 106 272, 112 134 
           C 120 112, 184 98, 256 98 Z" 
        fill="url(#hg-shield-grad)" 
        stroke="#059669" 
        stroke-width="1.5" />

  <!-- 纯白极简守护勾勒 (Checkmark) -->
  <path d="M 195 263 L 240 308 L 323 198" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="40" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>